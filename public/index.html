<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Tailnet Home</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='1' y='1' width='10' height='10' fill='%230050ef'/><rect x='13' y='1' width='10' height='10' fill='%23008a00'/><rect x='1' y='13' width='10' height='10' fill='%23d80073'/><rect x='13' y='13' width='10' height='10' fill='%23c25100'/></svg>">
<style>
  /* 字体随页面自带（OFL，见 fonts/OFL.txt），不向外部请求 */
  @font-face { font-family: "Noto Sans"; font-weight: 300; font-display: swap; src: url(fonts/noto-sans-300.woff2) format("woff2");
               unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Noto Sans"; font-weight: 400; font-display: swap; src: url(fonts/noto-sans-400.woff2) format("woff2");
               unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Noto Sans"; font-weight: 600; font-display: swap; src: url(fonts/noto-sans-600.woff2) format("woff2");
               unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  :root {
    /* Metro 强调色：均取白字 ≥4.5:1 的色值 */
    --cobalt: #0050ef; --emerald: #008a00; --crimson: #a20025; --teal: #00827f;
    --magenta: #d80073; --orange: #c25100; --indigo: #6a00ff; --brown: #825a2c;
    --mauve: #76608a; --violet: #9a00e6; --olive: #5a7052; --steel: #56687a;

    --bg: oklch(0.14 0 0);
    --fg: oklch(0.97 0 0);
    --fg-2: oklch(0.72 0 0);
    --on-tile: oklch(0.99 0 0);
    --font: "Segoe UI", "Segoe UI Variable Text", "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    --g: 6px;                               /* 磁贴间距 */
    --u: 72px;                              /* 小磁贴边长 */
    --cols: 6;
    --metro: cubic-bezier(0.1, 0.9, 0.2, 1);
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: oklch(0.985 0 0); --fg: oklch(0.16 0 0); --fg-2: oklch(0.42 0 0); }
  }
  @media (max-width: 640px) {
    /* 手机：每行 4 个单位，两块中磁贴并排，与 Windows Phone 一致 */
    :root { --cols: 4; --u: calc((100vw - 2 * max(16px, env(safe-area-inset-left)) - 3 * var(--g)) / 4); }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.35 var(--font);
         -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  a, button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  .wrap { max-width: 1240px; margin: 0 auto;
          padding: max(env(safe-area-inset-top), 10px) max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left)); }

  /* 状态栏 */
  .tray { display: flex; justify-content: space-between; font-size: 12px; color: var(--fg-2); padding: 4px 0; }
  .tray b { font-weight: 600; color: var(--fg); }
  .tray-r { display: flex; align-items: center; gap: 14px; }
  #lang { font-size: 12px; color: var(--fg-2); padding: 2px 0; }
  @media (hover: hover) { #lang:hover { color: var(--fg); } }

  h1 { margin: clamp(18px, 4vw, 36px) 0 clamp(16px, 3vw, 28px); font: 300 clamp(44px, 8vw, 72px)/1 var(--font); letter-spacing: -0.01em; }

  /* 分组 */
  .groups { display: flex; flex-wrap: wrap; gap: 32px 56px; align-items: flex-start; }
  .group { animation: enter .7s var(--metro) both; animation-delay: calc(var(--i, 0) * 70ms); }
  @keyframes enter { from { opacity: 0; transform: translateX(40px); } }
  .group h2 { margin: 0 0 10px; font: 300 20px/1.2 var(--font); color: var(--fg); }
  .group h2 small { font-size: 13px; color: var(--fg-2); margin-left: 6px; }
  .grid { display: grid; grid-template-columns: repeat(var(--cols), var(--u)); grid-auto-rows: var(--u);
          gap: var(--g); grid-auto-flow: row dense; }

  /* 磁贴 */
  .tile { position: relative; overflow: hidden; background: var(--c, var(--cobalt)); color: var(--on-tile);
          transition: transform .18s var(--metro), filter .15s; will-change: transform; }
  .tile.s { grid-column: span 1; grid-row: span 1; }
  .tile.m { grid-column: span 2; grid-row: span 2; }
  .tile.w { grid-column: span 4; grid-row: span 2; }
  @media (hover: hover) { a.tile:hover, button.tile:hover { filter: brightness(1.12); } }
  .tile.sel { box-shadow: inset 0 0 0 3px var(--on-tile); }
  .tile.dim { filter: saturate(.2) brightness(.75); }
  .tile[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--on-tile); }

  /* 正反两面：动态磁贴向上滑出背面 */
  .faces { position: absolute; inset: 0; transition: transform .75s var(--metro); }
  .tile.peek .faces { transform: translateY(-100%); }
  .face { position: absolute; left: 0; right: 0; height: 100%; }
  .face.back { top: 100%; padding: 10px 12px 28px; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; }
  .face.back p { margin: 0; font-size: 14px; line-height: 1.35; }
  .face.back span { font-size: 12px; opacity: .85; }
  .face.back.live { gap: 2px; }
  .face.back.live p { font: 300 calc(var(--u) * 0.42)/1.05 var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .glyph { position: absolute; inset: 0; display: grid; place-items: center; padding-bottom: 8%; }
  .glyph svg { width: 38%; height: 38%; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tile.s .glyph svg { width: 46%; height: 46%; }
  .tile.w .glyph svg { width: 19%; height: 38%; }
  .glyph .ch { font: 300 calc(var(--u) * 0.6)/1 var(--font); }
  .tile.s .glyph .ch { font-size: calc(var(--u) * 0.42); }

  .lbl { position: absolute; left: 8px; right: 34px; bottom: 6px; font-size: 13px; line-height: 1.2;
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.s .lbl { font-size: 10.5px; left: 5px; right: 5px; bottom: 4px; }
  .badge { position: absolute; right: 8px; bottom: 6px; font-size: 13px; font-weight: 600; }
  .tile.s .badge { top: 4px; right: 6px; bottom: auto; font-size: 11px; }
  .flag { position: absolute; top: 6px; right: 8px; font-size: 11px; font-weight: 600; padding: 1px 5px;
          background: oklch(0 0 0 / 0.35); }

  /* 总览宽磁贴 */
  .ov { padding: 10px 12px; display: flex; flex-direction: column; }
  .ov.live { padding: 0; }
  /* 动态总览：几页内容竖排，定时向上翻一页 */
  .ov .pg { padding: 10px 12px; display: flex; flex-direction: column; }
  .ov .big { font: 300 calc(var(--u) * 0.36)/1.1 var(--font); }
  .ov ul { list-style: none; margin: auto 0 18px; padding: 0; font-size: 13px; }
  .ov li { display: flex; justify-content: space-between; gap: 12px; }
  .ov li span { opacity: .8; white-space: nowrap; }
  .ov .num { font: 300 calc(var(--u) * 0.95)/1 var(--font); margin-top: auto; }
  .ov .num small { font-size: 15px; margin-left: 6px; font-weight: 400; }
  .ov .sub { font-size: 13px; opacity: .9; margin-bottom: 18px; }
  .ov .stale { background: oklch(0 0 0 / 0.3); padding: 1px 6px; }
  .ov dl { margin: auto 0 18px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
  .ov dt { opacity: .8; }
  .ov dd { margin: 0; overflow-wrap: anywhere; }
  .ov .copy { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: oklch(1 0 0 / 0.5); text-align: left; }
  .ov .dev-name { font: 300 calc(var(--u) * 0.5)/1.1 var(--font); }

  .note { color: var(--fg-2); font-size: 14px; max-width: 420px; }
  .note strong { display: block; font: 300 26px var(--font); color: var(--fg); margin-bottom: 6px; }
  .note button { margin-top: 14px; background: var(--cobalt); color: var(--on-tile); padding: 8px 18px; }
  .skel { background: oklch(0.5 0 0 / 0.15); animation: pulse 1.2s ease-in-out infinite alternate; }
  @keyframes pulse { to { opacity: .4; } }

  footer { margin-top: 40px; font-size: 12px; color: var(--fg-2); }
  kbd { font: inherit; font-weight: 600; color: var(--fg); }

  .toast { position: fixed; left: 0; right: 0; top: 0; padding: max(env(safe-area-inset-top), 10px) 20px 10px;
           background: var(--cobalt); color: var(--on-tile); font-size: 14px;
           transform: translateY(-100%); transition: transform .35s var(--metro); }
  .toast.show { transform: none; }

  /* 应用列表（手机）：Windows Phone 开始屏幕右下角箭头进入的字母列表 */
  .to-apps, .apps { display: none; }

  /* ── 手机：照 Windows Phone 8.1 开始屏幕 ── */
  @media (max-width: 640px) {
    :root { --bg: #000; --fg: #fff; --fg-2: oklch(0.7 0 0); }
    body { background: #000; touch-action: pan-y; }
    .wrap { padding-top: max(env(safe-area-inset-top), 4px); }
    .tray { position: sticky; top: 0; z-index: 2; background: #000; margin: 0 -16px; padding: 6px 16px 4px; color: var(--fg); }
    .tray .sig { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; margin-right: 8px; vertical-align: -1px; }
    .tray .sig i { width: 3px; background: var(--fg); opacity: .3; }
    .tray .sig i.on { opacity: 1; }
    h1, footer, .group h2 { display: none; }
    /* 所有分组并成一张连续的 4 列网格，组间只靠颜色区分 */
    .groups { display: grid; grid-template-columns: repeat(4, var(--u)); grid-auto-rows: var(--u);
              gap: var(--g); grid-auto-flow: row dense; align-items: stretch; margin-top: 12px; }
    .group, .grid { display: contents; }
    .note { grid-column: 1 / -1; grid-row: span 3; }
    /* 转门动画：磁贴绕屏幕左缘翻入，origin 由脚本按位置设置 */
    .tile.turn { animation: turnstile .55s var(--metro) backwards; }
    @keyframes turnstile { from { opacity: 0; transform: perspective(900px) rotateY(-80deg); } }

    .to-apps { display: grid; place-items: center; width: 44px; height: 44px; margin: 24px 0 0 auto;
               border: 2px solid var(--fg); border-radius: 50%; }
    .to-apps svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
    .apps { display: block; position: fixed; inset: 0; z-index: 3; background: #000; overflow-y: auto;
            padding: 0 16px 48px; transform: translateX(100%); visibility: hidden; touch-action: pan-y;
            transition: transform .45s var(--metro), visibility 0s .45s; }
    .apps.open { transform: none; visibility: visible; transition: transform .45s var(--metro); }
    .apps-top { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 14px; margin: 0 -16px;
                padding: max(env(safe-area-inset-top), 12px) 16px 10px; background: #000; font: 600 13px/1 var(--font);
                letter-spacing: .06em; text-transform: uppercase; }
    .apps-top button { display: grid; place-items: center; width: 40px; height: 40px; border: 2px solid var(--fg); border-radius: 50%; }
    .apps-top svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
    .apps h3 { width: 48px; height: 48px; margin: 18px 0 8px; display: flex; align-items: flex-end; padding: 0 0 3px 5px;
               border: 2px solid var(--cobalt); color: var(--fg); font: 300 30px/1 var(--font); }
    .apps a { display: flex; align-items: center; gap: 12px; padding: 4px 0; font: 300 20px/1.2 var(--font); }
    .apps a > span:first-child { flex: none; width: 48px; height: 48px; display: grid; place-items: center; background: var(--c, var(--cobalt)); }
    .apps a svg { width: 26px; height: 26px; fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .apps a .ch { font: 300 26px/1 var(--font); color: #fff; }
    .apps a small { display: block; font-size: 12px; color: var(--fg-2); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="tray"><span id="tray-l"></span><span class="tray-r"><button id="lang"></button><b id="clock"></b></span></div>
  <h1 id="title"></h1>
  <main id="main" class="groups" aria-busy="true">
    <div class="group"><div class="grid"><div class="tile w skel"></div><div class="tile m skel"></div></div></div>
  </main>
  <footer id="keys"></footer>
  <button class="to-apps" id="to-apps"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button>
</div>
<nav class="apps" id="apps">
  <div class="apps-top"><button id="to-start"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"/></svg></button><span id="apps-title"></span></div>
  <div id="apps-list"></div>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
// 访问 /home 时补上结尾斜杠，保证相对路径 data.json 正确解析
if (!location.pathname.endsWith('/') && !location.pathname.endsWith('.html')) {
  location.replace(location.pathname + '/' + location.search + location.hash);
}

const $ = id => document.getElementById(id);

// ── 界面文案：?lang= > 右上角切换（存在本浏览器）> data.json 的 lang > 英文 ──
const I18N = {
  en: {
    start: 'Start', devices: 'Devices', other: 'Other', offline: 'Offline', unreachable: 'Unreachable', online: 'Online',
    collapse: 'Hide', justNow: 'just now', min: m => `${m} min ago`, hr: h => `${h} h ago`, day: d => `${d} d ago`,
    lastSeen: t => `, last seen ${t}`, onlineOf: n => `/ ${n} online`, scanned: t => `Scanned ${t}`,
    stale: t => `No new data for ${t.replace(' ago', '')}`, back: '‹ Press Esc or tap the device again',
    deviceDetail: 'Device details', overview: 'Device overview', nServices: n => `${n} service${n > 1 ? 's' : ''}`, self: 'this device',
    showOffline: n => `Show ${n} offline device${n > 1 ? 's' : ''}`, hideOffline: 'Hide offline devices',
    noSvc: '<strong>No services on this device</strong>Add some in services.json; they show up after the next scan.',
    copied: v => `Copied ${v}`, sep: ', ',
    loadFail: '<strong>Can’t load the service list</strong>data.json failed to load: the scan may not have run yet, or the network is down.',
    retry: 'Reload', demo: 'Demo · fake tailnet',
    allApps: 'All services', backToStart: 'Back to Start', other_lang: '中文', switchTo: '切换到中文',
    allOnline: n => `All ${n} devices online`, more: n => `+${n} more`,
    svcUnit: 'services', nDown: n => `${n} unreachable`, allUp: 'All reachable',
    keys: '<kbd>↑ ↓</kbd> select　<kbd>↵</kbd> open　<kbd>⌘↵</kbd> new tab　<kbd>Esc</kbd> show all　·　rescanned every 10 min',
  },
  zh: {
    start: '开始', devices: '设备', other: '其他', offline: '离线', unreachable: '不可达', online: '在线',
    collapse: '收起', justNow: '刚刚', min: m => `${m} 分钟前`, hr: h => `${h} 小时前`, day: d => `${d} 天前`,
    lastSeen: t => `，最后出现于 ${t}`, onlineOf: n => `/ ${n} 台在线`, scanned: t => `扫描于 ${t}`,
    stale: t => `数据已${t.replace('前', '')}未更新`, back: '‹ 按 Esc 或再点一次设备返回',
    deviceDetail: '设备详情', overview: '设备概况', nServices: n => `${n} 个服务`, self: '本机',
    showOffline: n => `显示 ${n} 台离线设备`, hideOffline: '收起离线设备',
    noSvc: '<strong>这台设备上没有服务</strong>在 services.json 里为它添加，下次扫描后出现在这里。',
    copied: v => `已复制 ${v}`, sep: '，',
    loadFail: '<strong>暂时读不到服务列表</strong>data.json 加载失败：可能是扫描任务还没跑过，或网络中断。',
    retry: '重新加载', demo: '演示 · 虚构数据',
    allApps: '全部服务', backToStart: '返回开始屏幕', other_lang: 'EN', switchTo: 'Switch to English',
    allOnline: n => `${n} 台设备全部在线`, more: n => `还有 ${n} 台`,
    svcUnit: '个服务', nDown: n => `${n} 个不可达`, allUp: '全部可达',
    keys: '<kbd>↑ ↓</kbd> 选择　<kbd>↵</kbd> 打开　<kbd>⌘↵</kbd> 新标签　<kbd>Esc</kbd> 返回全部　·　每 10 分钟自动扫描',
  },
};
const pickLang = pref => /^zh/i.test(pref || '') ? 'zh' : pref ? 'en' : null;
let T;
function setLang(dataLang) {
  let saved = null;
  try { saved = localStorage.getItem('tsh-lang'); } catch {}
  const lang = pickLang(new URLSearchParams(location.search).get('lang')) || pickLang(saved) || pickLang(dataLang) || 'en';
  T = I18N[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  $('title').textContent = T.start;
  $('keys').innerHTML = T.keys;
  $('to-apps').setAttribute('aria-label', T.allApps);
  $('lang').textContent = T.other_lang;
  $('lang').setAttribute('aria-label', T.switchTo);
  $('apps').setAttribute('aria-label', T.allApps);
  $('apps-title').textContent = T.allApps;
  $('to-start').setAttribute('aria-label', T.backToStart);
}
setLang();
function switchLang() {
  const next = document.documentElement.lang === 'en' ? 'zh' : 'en';
  try { localStorage.setItem('tsh-lang', next); } catch {}
  // 地址栏里的 ?lang= 优先级更高，切换后去掉，否则切不过去
  const url = new URL(location.href);
  if (url.searchParams.has('lang')) { url.searchParams.delete('lang'); history.replaceState(history.state, '', url); }
  setLang(state.data?.lang);
  if (state.data) { state.animate = false; render(); }
}
const OTHER = '\0other';   // 未打标签的分组，显示时再翻译
// engaged：用户按过方向键之后才显示选中框
const state = { data: null, device: null, sel: 0, animate: true, engaged: false, showOffline: false };
const usage = (() => { try { return JSON.parse(localStorage.getItem('tsh-usage') || '{}'); } catch { return {}; } })();
const PALETTE = ['cobalt', 'emerald', 'crimson', 'teal', 'magenta', 'orange', 'indigo', 'brown', 'mauve', 'violet', 'olive'];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ── 白色线条图标（24×24） ──
const G = {
  ledger: '<rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M8 3v18M11 8h6M11 12h6"/>',
  coin: '<circle cx="12" cy="12" r="8.5"/><path d="M14.6 9.3c-.6-.8-1.5-1.3-2.6-1.3-1.6 0-2.7.9-2.7 2s1 1.6 2.8 2 2.8 1 2.8 2.2-1.2 2.1-2.8 2.1c-1.2 0-2.2-.5-2.8-1.3M12 6.5V8M12 16v1.5"/>',
  book: '<path d="M3 5.5C5 4.5 8.5 4.3 12 6c3.5-1.7 7-1.5 9-.5V19c-2-1-5.5-1.2-9 .5-3.5-1.7-7-1.5-9-.5z"/><path d="M12 6v13.5"/>',
  reader: '<path d="M5 3.5h14v17H5z"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/>',
  photo: '<rect x="3" y="5" width="18" height="14" rx="1.5"/><circle cx="9" cy="10" r="1.6"/><path d="m4 17.5 5-4.5 4 3.5 3-2.5 4 3.5"/>',
  cloud: '<path d="M7 18.5h10.5a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.5 9.7 4.4 4.4 0 0 0 7 18.5z"/>',
  doc: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
  pen: '<path d="M4 20l1.2-4.6L15.5 5.1a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z"/><path d="M13.5 7l3.5 3.5"/>',
  git: '<circle cx="6.5" cy="5.5" r="2"/><circle cx="6.5" cy="18.5" r="2"/><circle cx="17.5" cy="8.5" r="2"/><path d="M6.5 7.5v9M17.5 10.5c0 4-5.5 3.5-10 6.5"/>',
  code: '<path d="m8.5 7-5 5 5 5M15.5 7l5 5-5 5M13.5 5l-3 14"/>',
  car: '<path d="M3.5 16V12l2.2-5h12.6l2.2 5v4z"/><path d="M3.5 12h17"/><circle cx="7.5" cy="16.5" r="1.8"/><circle cx="16.5" cy="16.5" r="1.8"/>',
  chart: '<path d="M4 20h16M7.5 16v-5M12 16V7M16.5 16v-8"/>',
  db: '<ellipse cx="12" cy="6" rx="7" ry="2.8"/><path d="M5 6v12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V6M5 12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8"/>',
  server: '<rect x="3.5" y="4" width="17" height="6.5" rx="1"/><rect x="3.5" y="13.5" width="17" height="6.5" rx="1"/><path d="M7 7.25h.01M7 16.75h.01"/>',
  spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18.5 15.5l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>',
  home: '<path d="M4 11 12 4l8 7"/><path d="M6.5 9.5V20h11V9.5"/>',
  globe: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 3.5 5.5 3.5 8.5s-1 5.9-3.5 8.5c-2.5-2.6-3.5-5.5-3.5-8.5s1-5.9 3.5-8.5z"/>',
  laptop: '<rect x="5" y="5" width="14" height="10" rx="1"/><path d="M3 19h18"/>',
  desktop: '<rect x="3.5" y="4" width="17" height="11" rx="1"/><path d="M9 20h6M12 15v5"/>',
  phone: '<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/>',
  more: '<circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/>',
};
// 按名字 / 标签匹配图标；services.json 里也可以用 "glyph" 字段指定
const RULES = [
  [/immich|photoprism|photo|gallery|相册|照片/i, 'photo'], [/nextcloud|seafile|syncthing|drive|网盘/i, 'cloud'],
  [/gitea|gitlab|forgejo|\bgit\b/i, 'git'], [/gist|code|snippet/i, 'code'],
  [/grafana|prometheus|uptime|chart|dashboard|看板/i, 'chart'], [/minio|\bs3\b|storage|存储/i, 'db'],
  [/portainer|docker|panel|容器/i, 'server'], [/ollama|llm|\bai\b/i, 'spark'],
  [/paperless|wiki|\bdocs?\b|文档/i, 'doc'], [/rss|reader|阅读/i, 'reader'], [/memos|\bnotes?\b|笔记/i, 'pen'],
  [/home|tailnet/i, 'home'],
];
const svg = key => `<svg viewBox="0 0 24 24" aria-hidden="true">${G[key] || G.globe}</svg>`;
const glyphOf = s => s.glyph || (RULES.find(([re]) => re.test(`${s.name} ${s.note || ''}`)) || [, 'globe'])[1];
const deviceGlyph = d => /ios|android/i.test(d.os) ? 'phone' : /linux/i.test(d.os) ? 'server'
  : /mini|pc|desktop/i.test(d.hostname) || /windows/i.test(d.os) ? 'desktop' : 'laptop';

function resolveUrl(s, devices) {
  if (s.url) return s.url;
  const d = devices.find(d => d.name === s.device);
  const scheme = s.scheme || (s.port === 443 ? 'https' : 'http');
  // 统一用 Tailscale IP；https 只能用域名（serve 证书绑定域名）
  const host = (scheme === 'https' ? d?.dns || d?.ip : d?.ip || d?.dns) || s.device;
  const port = s.port && ![80, 443].includes(s.port) ? `:${s.port}` : '';
  return `${scheme}://${host}${port}${s.path || '/'}`;
}

// 入口：端口 > 路径 > 协议
function gate(url) {
  try {
    const u = new URL(url);
    if (u.port) return ':' + u.port;
    if (u.pathname !== '/') return u.pathname.replace(/\/$/, '');
    return u.protocol.replace(':', '');
  } catch { return ''; }
}

const deviceOf = name => state.data.devices.find(d => d.name === name);
// iOS 设备的主机名常是 localhost，这时用 MagicDNS 短名区分
const label = d => !d.hostname || d.hostname === 'localhost' ? d.name : d.hostname;
const short = d => label(d).replace(/^.*?['’]s\s+/, '');   // 「Alice’s Mac mini」→「Mac mini」

function ago(iso) {
  if (!iso || iso.startsWith('0001')) return '';
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return T.justNow;
  if (m < 60) return T.min(m);
  if (m < 1440) return T.hr(Math.round(m / 60));
  return T.day(Math.round(m / 1440));
}

function services() {
  const { data } = state;
  return data.services
    .map((s, order) => ({ ...s, url: resolveUrl(s, data.devices), order }))
    .filter(s => !state.device || s.device === state.device);
}

// 按第一个标签分组，组序取数据里首次出现的顺序；未打标签的归入「其他」排最后
function groupBy(list, key) {
  const groups = new Map();
  for (const x of list) {
    const g = key(x);
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(x);
  }
  const other = groups.get(OTHER);
  if (other) { groups.delete(OTHER); groups.set(OTHER, other); }
  return [...groups];
}

let n = 0;   // 可导航条目序号

function svcTile(s, size) {
  const d = deviceOf(s.device);
  const off = d && !d.online;
  const flag = off ? T.offline : s.up === false ? T.unreachable : '';    // 可达性由 scan.py 在服务器端检查
  const desc = s.source === 'manual' && s.note ? s.note : '';
  const meta = [state.device ? '' : d ? short(d) : s.device, gate(s.url)].filter(Boolean).join(' · ');
  const i = n++;
  // live：scan.py 从服务接口取回的几行数据，第一行大字显示在背面
  const back = s.live?.length
    ? `<div class="face back live"><p>${esc(s.live[0])}</p>${s.live.slice(1).map(l => `<span>${esc(l)}</span>`).join('')}</div>`
    : `<div class="face back"><p>${esc(desc || s.name)}</p><span>${esc(meta)}</span></div>`;
  return `<a class="tile ${size}${off ? ' dim' : ''}${s.live?.length ? ' live' : ''}${state.engaged && i === state.sel ? ' sel' : ''}" data-nav data-i="${i}"
             href="${esc(s.url)}" data-url="${esc(s.url)}" title="${esc(`${s.name}\n${s.url}`)}" aria-label="${esc(s.name)}${flag ? T.sep + flag : ''}">
    <div class="faces">
      <div class="face"><div class="glyph">${svg(glyphOf(s))}</div></div>
      ${size !== 's' ? back : ''}
    </div>
    <span class="lbl">${esc(s.name)}</span>
    ${flag ? `<span class="flag">${flag}</span>` : ''}
  </a>`;
}

// 分组名来自 services.json 的标签和书签 group；labels 给出其他语言的显示名，如 {"zh": {"Finance": "理财"}}
const groupName = name => name === OTHER ? T.other
  : esc(state.data.labels?.[document.documentElement.lang.slice(0, 2)]?.[name] || name);

let ovPage = 0;   // 总览磁贴当前显示第几页，重绘时保持

function overviewTile() {
  const { devices, services: all, tailnet, generated } = state.data;
  const d = state.device && deviceOf(state.device);
  if (d) {
    const st = d.online ? T.online : `${T.offline}${ago(d.lastSeen) ? T.lastSeen(ago(d.lastSeen)) : ''}`;
    return `<section class="tile w ov" aria-label="${T.deviceDetail}">
      <div class="dev-name">${esc(short(d))}</div>
      <div class="sub">${esc(d.os)} · ${st}</div>
      <dl>
        <dt>IP</dt><dd><button class="copy" data-copy="${esc(d.ip)}">${esc(d.ip)}</button></dd>
        <dt>DNS</dt><dd><button class="copy" data-copy="${esc(d.dns)}">${esc(d.dns)}</button></dd>
      </dl>
      <span class="lbl">${T.back}</span>
      <span class="badge">${all.filter(s => s.device === d.name).length}</span>
    </section>`;
  }
  const online = devices.filter(x => x.online).length;
  const stale = !state.data.demo && Date.now() - new Date(generated) > 30 * 60000;   // 扫描每 10 分钟一次，超过 30 分钟说明扫描停了
  const off = devices.filter(x => !x.online);
  const down = all.filter(s => s.up === false).length;
  const pages = [
    `<div class="num">${online}<small>${T.onlineOf(devices.length)}</small></div>
     <div class="sub">${state.data.demo ? T.demo : stale ? `<span class="stale">${T.stale(ago(generated))}</span>` : T.scanned(ago(generated) || T.justNow)}</div>`,
    off.length
      ? `<div class="big">${T.offline} ${off.length}</div>
         <ul>${off.slice(0, 3).map(x => `<li>${esc(short(x))}<span>${esc(ago(x.lastSeen))}</span></li>`).join('')}
         ${off.length > 3 ? `<li>${T.more(off.length - 3)}</li>` : ''}</ul>`
      : `<div class="num">${online}</div><div class="sub">${T.allOnline(online)}</div>`,
    `<div class="num">${all.length}<small>${T.svcUnit}</small></div><div class="sub">${down ? T.nDown(down) : T.allUp}</div>`,
  ];
  ovPage %= pages.length;
  return `<section class="tile w ov live" aria-label="${T.overview}">
    <div class="faces" style="transform:translateY(${-ovPage * 100}%)">${pages.map((p, i) => `<div class="face pg" style="top:${i * 100}%">${p}</div>`).join('')}</div>
    <span class="lbl">${esc(tailnet)}</span>
  </section>`;
}

function deviceTiles() {
  const { devices, services: all } = state.data;
  const count = name => all.filter(s => s.device === name).length;
  const shown = devices.filter(d => d.online || state.showOffline || d.name === state.device);
  const offline = devices.filter(d => !d.online).length;
  return shown.map(d => `
    <button class="tile s${d.online ? '' : ' dim'}" style="--c:var(--steel)" data-device="${esc(d.name)}" aria-pressed="${state.device === d.name}"
            title="${esc(label(d))}" aria-label="${esc(label(d))}${T.sep}${d.online ? T.online : T.offline}${count(d.name) ? T.sep + T.nServices(count(d.name)) : ''}${d.self ? T.sep + T.self : ''}">
      <div class="glyph">${svg(deviceGlyph(d))}</div>
      <span class="lbl">${esc(short(d))}</span>${count(d.name) ? `<span class="badge">${count(d.name)}</span>` : ''}
    </button>`).join('') +
    (offline ? `<button class="tile s" style="--c:var(--steel)" id="more" aria-expanded="${state.showOffline}"
        aria-label="${state.showOffline ? T.hideOffline : T.showOffline(offline)}">
      <div class="glyph">${state.showOffline ? svg('more') : `<span class="ch">+${offline}</span>`}</div>
      <span class="lbl">${state.showOffline ? T.collapse : T.offline}</span></button>` : '');
}

function render() {
  const main = $('main');
  main.removeAttribute('aria-busy');
  n = 0;
  const list = services();
  // 点击最多的服务用宽磁贴
  const top = !state.device && [...list].sort((a, b) => (usage[b.url] || 0) - (usage[a.url] || 0) || a.order - b.order)[0];
  const groups = groupBy(list, s => (s.tags || [])[0] || OTHER);
  const marks = state.device ? [] : groupBy((state.data.bookmarks || []).filter(b => b.kind !== 'note'), b => b.group || OTHER);
  // notes/ 里的私人页面：中磁贴，紧跟设备，不和书签小磁贴挤在一起
  // notes 存在运行 scan.py 的这台机器上：筛选到它时也显示
  const notes = (state.data.bookmarks || []).filter(b => b.kind === 'note' && (!state.device || b.device === state.device));
  let g = 0;

  let html = `<section class="group" style="--i:${g++}"><h2>${T.devices}</h2><div class="grid" style="--c:var(--cobalt)">${overviewTile()}${deviceTiles()}</div></section>`;
  // notes 默认自成一组紧跟设备；services.json 的 notes_group 指向某个标签时并进那一组
  const noteTile = b => {
    const i = n++;
    return `<a class="tile m${state.engaged && i === state.sel ? ' sel' : ''}" data-nav data-i="${i}" href="${esc(b.url)}" data-url="${esc(b.url)}"
               title="${esc(b.name)}" aria-label="${esc(b.name)}" style="--c:var(--mauve)">
      <div class="faces">
        <div class="face"><div class="glyph">${svg('doc')}</div></div>
        <div class="face back"><p>${esc(b.name)}</p><span>${esc(b.note || '')}</span></div>
      </div>
      <span class="lbl">${esc(b.name)}</span></a>`;
  };
  const host = notes.length && groups.find(([name]) => name === notes[0].group);
  if (notes.length && !host) {
    html += `<section class="group" style="--i:${g++}"><h2>${groupName(notes[0].group)}<small>${notes.length}</small></h2>
      <div class="grid">${notes.map(noteTile).join('')}</div></section>`;
  }
  if (state.device && !list.length) {
    html += `<div class="note">${T.noSvc}</div>`;
  }
  groups.forEach(([name, items], gi) => {
    const extra = host && host[0] === name ? notes : [];
    html += `<section class="group" style="--i:${g++}"><h2>${groupName(name)}<small>${items.length + extra.length}</small></h2>
      <div class="grid" style="--c:var(--${PALETTE[gi % PALETTE.length]})">${items.map(s => svcTile(s, s === top ? 'w' : 'm')).join('')}${extra.map(noteTile).join('')}</div></section>`;
  });
  marks.forEach(([name, items], mi) => {
    html += `<section class="group" style="--i:${g++}"><h2>${groupName(name)}<small>${items.length}</small></h2>
      <div class="grid" style="--c:var(--${PALETTE[(groups.length + mi) % PALETTE.length]})">${items.map(b => {
        // 网站图标常带不透明底色，转成剪影会变成白方块，所以统一用细体首字母
        const ch = esc(([...b.name.trim()][0] || '?').toUpperCase());
        const i = n++;
        return `<a class="tile s${state.engaged && i === state.sel ? ' sel' : ''}" data-nav data-i="${i}" href="${esc(b.url)}" data-url="${esc(b.url)}"
                   title="${esc(b.note ? `${b.name}\n${b.note}` : b.name)}" aria-label="${esc(b.name)}">
          <div class="glyph"><span class="ch">${ch}</span></div>
          <span class="lbl">${esc(b.name)}</span></a>`;
      }).join('')}</div></section>`;
  });
  main.innerHTML = html;
  state.sel = Math.min(state.sel, Math.max(n - 1, 0));
  if (!state.animate) main.querySelectorAll('.group').forEach(el => el.style.animation = 'none');
  else if (phone.matches) turnstile(main);
  renderApps();
}

const phone = matchMedia('(max-width: 640px)');

// 先左列后右列、自上而下依次翻入，转轴都在屏幕左缘
function turnstile(root) {
  const left = root.getBoundingClientRect().left;
  root.querySelectorAll('.tile').forEach(t => {
    const r = t.getBoundingClientRect();
    if (r.top > innerHeight) return;
    t.style.transformOrigin = `${left - r.left}px 50%`;
    t.style.animationDelay = `${Math.round(r.top / 9 + (r.left - left) / 6)}ms`;
    t.classList.add('turn');
    t.addEventListener('animationend', () => { t.classList.remove('turn'); t.style.transformOrigin = ''; }, { once: true });
  });
}

function renderApps() {
  const { data } = state;
  const items = [
    ...data.services.map(s => ({ name: s.name, url: resolveUrl(s, data.devices), sub: s.device, icon: svg(glyphOf(s)) })),
    ...(data.bookmarks || []).map(b => ({ name: b.name, url: b.url, sub: b.note || '', icon: `<span class="ch">${esc(([...b.name.trim()][0] || '?').toUpperCase())}</span>` })),
  ].sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
  let html = '', last = '';
  for (const it of items) {
    const k = /^[a-z]/i.test(it.name) ? it.name[0].toUpperCase() : '#';
    if (k !== last) { html += `<h3>${k}</h3>`; last = k; }
    html += `<a href="${esc(it.url)}" data-app="${esc(it.url)}"><span>${it.icon}</span><span>${esc(it.name)}${it.sub ? `<small>${esc(it.sub)}</small>` : ''}</span></a>`;
  }
  $('apps-list').innerHTML = html;
}

// 应用列表走浏览器历史，手机上的返回手势能关掉它
function openApps(open) {
  if (open === $('apps').classList.contains('open')) return;
  $('apps').classList.toggle('open', open);
  if (open) { $('apps').scrollTop = 0; history.pushState({ apps: 1 }, ''); }
  else if (history.state?.apps) history.back();
}
addEventListener('popstate', () => $('apps').classList.remove('open'));

// 手机：开始屏幕左滑进入应用列表、列表右滑返回，面板跟着手指走
(() => {
  const apps = $('apps');
  let x0, y0, t0, dx, axis = 'none';
  const release = () => { apps.style.transform = apps.style.transition = apps.style.visibility = ''; };
  addEventListener('touchstart', e => {
    const t = e.touches[0];
    // 屏幕左缘留给浏览器自己的返回手势
    axis = !phone.matches || e.touches.length > 1 || t.clientX < 24 ? 'none' : null;
    x0 = t.clientX; y0 = t.clientY; t0 = e.timeStamp; dx = 0;
  }, { passive: true });
  addEventListener('touchmove', e => {
    if (axis === 'none') return;
    const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
    if (!axis) {
      if (Math.hypot(mx, my) < 10) return;
      axis = Math.abs(mx) > Math.abs(my) * 1.5 ? 'x' : 'none';
      if (axis === 'none') return;
    }
    const open = apps.classList.contains('open');
    dx = open ? Math.max(0, mx) : Math.min(0, mx);
    apps.style.transition = 'none';
    apps.style.visibility = 'visible';
    apps.style.transform = `translateX(${open ? dx : innerWidth + dx}px)`;
  }, { passive: true });
  addEventListener('touchend', e => {
    if (axis !== 'x') return;
    axis = 'none';
    const flick = Math.abs(dx) > 30 && Math.abs(dx) / (e.timeStamp - t0) > 0.5;
    release();   // 去掉内联位置，由 .apps 的过渡从手指位置滑到终点
    if (Math.abs(dx) > innerWidth * 0.3 || flick) openApps(!apps.classList.contains('open'));
  });
  addEventListener('touchcancel', () => { axis = 'none'; release(); });
})();

// ── 动态磁贴：随机挑一块带背面的磁贴向上滑出，几秒后滑回 ──
function livePeek() {
  if (document.hidden || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const tiles = [...document.querySelectorAll('.tile:has(.back):not(.peek):not(:hover)')];
  if (!tiles.length) return;
  // 带数据的磁贴翻得更勤
  const pool = tiles.flatMap(t => t.classList.contains('live') ? [t, t, t] : [t]);
  const t = pool[Math.floor(Math.random() * pool.length)];
  t.classList.add('peek');
  setTimeout(() => t.classList.remove('peek'), 3500 + Math.random() * 1500);
}

// 总览磁贴每隔几秒翻到下一页：在线数 → 离线设备 → 服务数
function liveOverview() {
  const f = document.querySelector('.ov.live .faces');
  if (!f || document.hidden || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  ovPage = (ovPage + 1) % f.children.length;
  f.style.transform = `translateY(${-ovPage * 100}%)`;
}

// ── 按压倾斜：磁贴朝按下的位置倾斜，松开回正 ──
document.addEventListener('pointerdown', e => {
  const t = e.target.closest('.tile[data-nav], .tile[data-device], #more');
  if (!t || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = t.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
  t.style.transform = `perspective(700px) rotateX(${(-y * 14).toFixed(1)}deg) rotateY(${(x * 14).toFixed(1)}deg) scale(.96)`;
  const reset = () => { t.style.transform = ''; t.removeEventListener('pointerup', reset); t.removeEventListener('pointerleave', reset); };
  t.addEventListener('pointerup', reset); t.addEventListener('pointerleave', reset);
});

function tick() {
  const now = new Date();
  $('clock').textContent = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false });
}

function saveState() {
  const qs = state.device ? '?at=' + encodeURIComponent(state.device) : '';
  history.replaceState(null, '', location.pathname + qs + location.hash);
}

function loadState() {
  const at = new URLSearchParams(location.search).get('at');
  state.device = at && deviceOf(at) ? at : null;
}

function refresh() { state.animate = false; render(); saveState(); }

function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1600);
}

function go(url, newTab) {
  usage[url] = (usage[url] || 0) + 1;
  try { localStorage.setItem('tsh-usage', JSON.stringify(usage)); } catch {}
  newTab ? window.open(url, '_blank') : (location.href = url);
}

function select(i) {
  const items = [...document.querySelectorAll('[data-nav]')];
  if (!items.length) return;
  if (!state.engaged && i === state.sel + 1) i = state.sel;   // 第一次按 ↓ 先选中第一项
  state.engaged = true;
  state.sel = Math.max(0, Math.min(items.length - 1, i));
  items.forEach((el, j) => el.classList.toggle('sel', j === state.sel));
  items[state.sel].scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

document.addEventListener('click', e => {
  if (e.target.closest('#to-apps')) { openApps(true); return; }
  if (e.target.closest('#to-start')) { openApps(false); return; }
  if (e.target.closest('#lang')) { switchLang(); return; }
  const app = e.target.closest('[data-app]');
  if (app && !e.metaKey && !e.ctrlKey && e.button === 0) { e.preventDefault(); go(app.dataset.app, false); return; }
  if (e.target.closest('#more')) { state.showOffline = !state.showOffline; refresh(); return; }
  const cp = e.target.closest('[data-copy]');
  if (cp) { navigator.clipboard?.writeText(cp.dataset.copy).then(() => toast(T.copied(cp.dataset.copy))); return; }
  const dv = e.target.closest('[data-device]');
  if (dv) { state.device = state.device === dv.dataset.device ? null : dv.dataset.device; state.sel = 0; refresh(); return; }
  const t = e.target.closest('[data-nav]');
  if (t && !e.metaKey && !e.ctrlKey && e.button === 0) { e.preventDefault(); go(t.dataset.url, false); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('apps').classList.contains('open')) { openApps(false); return; }
  if (e.key === 'Escape') { state.device = null; state.sel = 0; refresh(); return; }
  const move = { ArrowDown: 1, ArrowUp: -1, ArrowRight: 1, ArrowLeft: -1 }[e.key];
  if (move) { e.preventDefault(); select(state.sel + move); return; }
  if (e.key === 'Enter' && document.activeElement === document.body) {
    const items = document.querySelectorAll('[data-nav]');
    if (items[state.sel]) { e.preventDefault(); go(items[state.sel].dataset.url, e.metaKey || e.ctrlKey); }
  }
});

function load() {
  fetch('data.json', { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      state.data = data;
      setLang(data.lang);
      document.title = data.title;
      const bars = Math.ceil(data.devices.filter(d => d.online).length / Math.max(data.devices.length, 1) * 5);
      $('tray-l').innerHTML = `<span class="sig" aria-hidden="true">${[1, 2, 3, 4, 5].map(i =>
        `<i class="${i <= bars ? 'on' : ''}" style="height:${i * 20}%"></i>`).join('')}</span>${esc(data.tailnet)}`;
      loadState();
      render();
      setInterval(() => { state.animate = false; render(); }, 60000);   // 刷新「扫描于」时间
      setInterval(livePeek, 2600);
      setInterval(liveOverview, 4500);
    })
    .catch(() => {
      $('main').removeAttribute('aria-busy');
      $('main').innerHTML = `<div class="note" role="alert">${T.loadFail}<br><button id="retry">${T.retry}</button></div>`;
      $('retry').onclick = load;
    });
}

tick(); setInterval(tick, 15000);
load();
</script>
</body>
</html>
