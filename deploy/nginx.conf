server {
    listen 80;
    root /usr/share/nginx/html;
    # 经 tailscale serve 挂在 /home 下，重定向必须保持相对路径
    absolute_redirect off;

    # data.json 由宿主机上的 scan.py 写入 ./var，挂载到 /data
    location = /data.json {
        alias /data/data.json;
        add_header Cache-Control "no-store";
    }

    # 私人页面：./var/notes/*.html，scan.py 会把它们列进主页的 Notes 分组
    location /notes/ {
        alias /data/notes/;
        add_header Cache-Control "no-cache";
    }

    # 应用：./var/apps/<id>/，只提供静态文件（docs/apps.md）。
    # CSP sandbox 让应用即使被直接打开也拿不到主页的同源权限（localStorage、cookie、DOM）
    location /apps/ {
        alias /data/apps/;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "sandbox allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox";
        add_header X-Content-Type-Options "nosniff";
    }

    # 旧地址：主页曾挂在 /home 下
    location /home {
        return 301 /;
    }

    # 页面本身不让浏览器留副本：Safari 对 no-cache 的页面有时仍直接用内存里的旧版本
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
