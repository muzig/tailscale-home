# Build and deploy on the Mac mini's host-mode runner (label: macmini).
# The web page runs in Docker; scan.py stays a host LaunchAgent because it
# needs the host's Tailscale CLI. The deploy checkout lives outside the runner
# workspace so ./var (data.json, services.json) persists between runs.
#
# Two channels, each with its own checkout, var/ (data, services, apps), scan agent, port and compose project:
#   main    -> stable  : ~/src/self-hosted/tailscale-home          127.0.0.1:4183
#   preview -> preview : ~/src/self-hosted/tailscale-home-preview  127.0.0.1:4185
# Try changes on `preview` first, then merge to `main`. See docs/channels.md.
#
# To reuse: change `runs-on` to your runner's label and the dirs/ports below if you like.
# Put your services list at $DEPLOY_DIR/var/services.json (see services.example.json).
name: deploy

on:
  push:
    branches: [main, preview]
  workflow_dispatch:

concurrency:
  group: deploy-${{ gitea.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: macmini
    env:
      TOKEN: ${{ gitea.token }}
      PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Pick channel
        run: |
          set -eu
          case "$GITHUB_REF_NAME" in
            main)    channel=stable;  suffix="";        port=4183 ;;
            preview) channel=preview; suffix="-preview"; port=4185 ;;
            *) echo "no channel for branch $GITHUB_REF_NAME"; exit 1 ;;
          esac
          {
            echo "CHANNEL=$channel"
            echo "HOME_PORT=$port"
            echo "DEPLOY_DIR=$HOME/src/self-hosted/tailscale-home$suffix"
            echo "AGENT=local.tailscale-home$suffix.scan"
            echo "COMPOSE_PROJECT_NAME=tailscale-home$suffix"
          } >> "$GITHUB_ENV"

      - name: Sync deploy checkout
        run: |
          set -eu
          [ -d "$DEPLOY_DIR/.git" ] || git init -q -b main "$DEPLOY_DIR"
          auth="Authorization: Basic $(printf 'ci:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -C "$DEPLOY_DIR" -c http.extraHeader="$auth" fetch -q --depth 1 "${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git -C "$DEPLOY_DIR" reset -q --hard FETCH_HEAD
          git -C "$DEPLOY_DIR" log --oneline -1

      - name: Install scan agent
        run: |
          set -eu
          mkdir -p "$DEPLOY_DIR/var"
          src="$DEPLOY_DIR/var/$AGENT.plist"
          sed -e "s|__DEPLOY_DIR__|$DEPLOY_DIR|g" -e "s|__HOME__|$HOME|g" -e "s|__LABEL__|$AGENT|g" -e "s|__CHANNEL__|$CHANNEL|g" \
            "$DEPLOY_DIR/deploy/local.tailscale-home.scan.plist" > "$src"
          dst="$HOME/Library/LaunchAgents/$AGENT.plist"
          domain="gui/$(id -u)"
          if ! cmp -s "$src" "$dst" || ! launchctl print "$domain/$AGENT" >/dev/null 2>&1; then
            launchctl bootout "$domain/$AGENT" 2>/dev/null || true
            cp "$src" "$dst"
            launchctl bootstrap "$domain" "$dst"
            echo "scan agent (re)loaded"
          else
            # scan.py may have changed; run it now with the new code
            launchctl kickstart "$domain/$AGENT"
          fi
          for i in $(seq 30); do [ -s "$DEPLOY_DIR/var/data.json" ] && break; sleep 2; done

      - name: Build image
        run: |
          set -eu
          cd "$DEPLOY_DIR"
          tag=$(printf %s "$GITHUB_SHA" | cut -c1-12)
          IMAGE_TAG=$tag docker compose build
          # latest always means the stable channel
          [ "$CHANNEL" = stable ] && docker tag "tailscale-home:$tag" tailscale-home:latest || true

      - name: Deploy
        run: |
          set -eu
          cd "$DEPLOY_DIR"
          tag=$(printf %s "$GITHUB_SHA" | cut -c1-12)
          printf 'IMAGE_TAG=%s\nHOME_PORT=%s\nCOMPOSE_PROJECT_NAME=%s\n' "$tag" "$HOME_PORT" "$COMPOSE_PROJECT_NAME" > .env
          docker compose up -d --no-build
          for i in $(seq 30); do
            if curl -fsS -o /dev/null "http://127.0.0.1:$HOME_PORT/" && curl -fsS -o /dev/null "http://127.0.0.1:$HOME_PORT/data.json"; then
              echo "tailscale-home:$tag is up on $CHANNEL ($HOME_PORT)"
              break
            fi
            [ "$i" = 30 ] && { docker compose logs --tail 50; tail -20 "$HOME/Library/Logs/$AGENT.log"; exit 1; }
            sleep 2
          done

      - name: Prune old images (keep 8)
        run: |
          # images in use by either channel can't be removed; docker rmi just refuses those
          docker images tailscale-home --format '{{.Tag}}' | grep -v '^latest$' | tail -n +9 | xargs -r -I{} docker rmi "tailscale-home:{}" || true
